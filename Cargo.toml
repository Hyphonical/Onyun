[package]
name = "onyun"
version = "0.1.0"
edition = "2024"
description = "High-speed Tor v3 .onion vanity address minter with CLI, Web UI, and Tauri desktop support"
license = "MIT"

[features]
default = ["desktop"]
web = [
    "dep:axum",
    "dep:futures-util",
    "dep:hmac",
    "dep:serde_json",
    "dep:subtle",
    "dep:tokio",
]
desktop = ["web", "dep:tauri"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true }
ctrlc = "3"
curve25519-dalek = "5"
futures-util = { version = "0.3", optional = true }
hmac = { version = "0.12", optional = true }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
sha3 = "0.10"
subtle = { version = "2", optional = true }
tauri = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }

[build-dependencies]
tauri-build = "2"
[lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
match_same_arms = "warn"
unnested_or_patterns = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[lints.rust]
unreachable_pub = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
