name: Linux Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
jobs:

  web:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Build Web UI
        run: bun run --cwd web build

      - name: Upload Web Assets
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    needs: web
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config

      - name: Install Linux ARM64 system dependencies
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Download Web Assets
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Test
        run: cargo test --features gpu --target ${{ matrix.target }}

      - name: Build Release
        run: cargo build --locked --release --features gpu --target ${{ matrix.target }}

      - name: Stage Files
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/onyun dist/onyun-linux-${{ matrix.arch }}
          [ -f LICENSE ] && cp LICENSE dist/ || true
          [ -f README.md ] && cp README.md dist/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: onyun-linux-${{ matrix.arch }}
          path: dist/*
          compression-level: 9
          if-no-files-found: error
          retention-days: 7
